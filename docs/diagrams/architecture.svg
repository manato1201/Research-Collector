class="title" x="640" y="292.0">collectors/</text><text class="sub mono" x="640" y="311.0">ソースごとの収集</text><text class="title" x="900" y="292.0">重複の除去</text><text class="sub mono" x="900" y="311.0">URL(seen_urls)+</text><text class="sub mono" x="900" y="326.0">意味(semantic_dedup)</text><text class="title" x="1160" y="292.0">classifier</text><text class="sub mono" x="1160" y="311.0">3 カテゴリ +「どれでもない」</text><text class="sub mono" x="1160" y="326.0">(補助)</text><text class="title" x="900" y="492.0">NotebookLM</text><text class="sub mono" x="900" y="511.0">週次ノートブックへ追加</text><text class="sub mono" x="900" y="526.0">レポート(水・日)</text><text class="title" x="1160" y="492.0">results.html</text><text class="sub mono" x="1160" y="511.0">収集結果ビュー・health.json</text><text class="title" x="1385" y="492.0">broadcast/</text><text class="sub mono" x="1385" y="511.0">Cloudflare 上の</text><text class="sub mono" x="1385" y="526.0">別システム</text><rect class="lab" x="377.8" y="221.0" width="34.5" height="16" rx="3"/><text class="alabel mono blue" x="395.0" y="233.0">新着</text><rect class="lab" x="1000.5" y="221.0" width="59.0" height="16" rx="3"/><text class="alabel mono blue" x="1030.0" y="233.0">代表だけ</text><rect class="lab" x="1236.9" y="421.0" width="71.2" height="16" rx="3"/><text class="alabel mono " x="1272.5" y="433.0">任意で送る</text><text class="hd" x="40" y="44" text-anchor="start">Research-Collector — 構成</text><text class="note" x="40" y="66" text-anchor="start">青=主な流れ / 灰の破線=任意。分類は補助で、迷ったら人の確認に回す</text><text class="note" x="500" y="602" text-anchor="start">認証の自動更新: Windows のタスクスケジューラで 1 日 2 回</text></svg>
