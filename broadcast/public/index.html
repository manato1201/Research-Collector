<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Research Broadcast</title>
<script src="/theme-init.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@300;400;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<a class="skip" href="#view">本文へ移動</a>

<header class="top">
  <div class="top-inner">
    <a class="brand" href="/" data-link>Research Broadcast</a>
    <nav class="tabs-nav" aria-label="メイン">
      <a href="/" data-link data-nav="home">放送</a>
      <a href="/radio" data-link data-nav="radio">ラジオ</a>
      <a href="/board" data-link data-nav="board">ボード</a>
      <a href="/weekly" data-link data-nav="weekly">特集</a>
      <a href="/reports" data-link data-nav="reports">レポート</a>
      <a href="/status" data-link data-nav="status">状態</a>
    </nav>
    <div class="top-actions">
      <button class="icon-btn" id="theme-btn" type="button" aria-label="テーマを切り替える">テーマ</button>
      <button class="icon-btn" id="logout-btn" type="button" hidden>ログアウト</button>
    </div>
  </div>
  <div class="status-bar" id="status-bar" role="status" aria-live="polite"></div>
</header>

<main id="view" tabindex="-1"></main>

<footer class="foot">
  <p>分類は記事のタイトルや要約から自動で付けたヒントで、確定ではありません。要約は配信元のフィードの一部で、本文の転載ではありません。</p>
  <p>読み上げは、お使いのブラウザ・端末の音声です(声は端末により異なります)。</p>
</footer>

<div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
  <div class="drawer-head">
    <h2 id="drawer-title"></h2>
    <button class="icon-btn" id="drawer-close" type="button" aria-label="閉じる">閉じる</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<div class="progress-bar" id="progress-bar" hidden aria-hidden="true"></div>

<div class="player" id="player" role="region" aria-label="読み上げプレーヤー" hidden>
  <div class="player-info">
    <span class="lamp" id="player-lamp">STANDBY</span>
    <b id="player-title"></b>
    <span id="player-chapter"></span>
    <span class="num" id="player-progress"></span>
  </div>
  <div class="player-controls">
    <button class="icon-btn" id="player-prev" type="button">前の章</button>
    <button class="icon-btn primary" id="player-toggle" type="button" aria-pressed="false">一時停止</button>
    <button class="icon-btn" id="player-next" type="button">次の章</button>
    <button class="icon-btn" id="player-stop" type="button">停止</button>
    <label class="player-sel"><span class="sr-only">速度</span>
      <select id="player-rate" aria-label="読み上げの速度">
        <option value="0.8">0.8倍</option>
        <option value="1" selected>1倍</option>
        <option value="1.25">1.25倍</option>
        <option value="1.5">1.5倍</option>
        <option value="1.75">1.75倍</option>
      </select>
    </label>
    <label class="player-sel"><span class="sr-only">スリープタイマー</span>
      <select id="player-sleep" aria-label="スリープタイマー(自動で止める)">
        <option value="0">タイマー: なし</option>
        <option value="15">15分で停止</option>
        <option value="30">30分で停止</option>
        <option value="60">60分で停止</option>
      </select>
    </label>
    <label class="player-check"><input type="checkbox" id="player-sfx" checked> 効果音</label>
    <label class="player-sel"><span class="sr-only">声</span>
      <select id="player-voice" aria-label="読み上げの声"></select>
    </label>
  </div>
  <p class="player-note" id="player-note" hidden>日本語の音声が見つかりません。端末の音声設定で日本語の声を追加すると読み上げられます。</p>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="/app.js"></script>
<noscript><p style="padding:2rem">このページの表示には JavaScript が必要です。</p></noscript>
</body>
</html>
